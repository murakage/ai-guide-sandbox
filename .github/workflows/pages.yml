# main に push すると、content/ からサイトを組み立てて GitHub Pages に公開する
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      # llms.txt などに書く URL を、公開先の URL にする
      - run: node build.mjs --base "${{ steps.pages.outputs.base_url }}/"
      # 10 倍版 (全文 約 2.35 MB) を /big/ に作る。原稿は毎回ここで作り直す
      - run: node gen-big.mjs
      - run: node build.mjs --content content-big --out public/big --base "${{ steps.pages.outputs.base_url }}/big/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
